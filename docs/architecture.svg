<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -120 1000 1362" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Block diagram of the DistillStudent network">
  <style>
    .bg{fill:#f7f8fa;stroke:#c9d2dd;stroke-width:1.5}
    .box{fill:#ffffff;stroke:#c4cdd8;stroke-width:1.5}
    .box-flow{fill:#e6eefc;stroke:#2f6df0;stroke-width:1.75}
    .box-action{fill:#f9e7cd;stroke:#d6811f;stroke-width:2}
    .box-train{fill:#eceff3;stroke:#8896a6;stroke-width:1.5;stroke-dasharray:5 4}
    .ghost{fill:#e6eefc;stroke:#2f6df0;stroke-width:1.5;opacity:.4}
    .t-title{fill:#18212c;font-size:15px;font-weight:600}
    .t-sub{fill:#5c6773;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
    .t-sub-flow{fill:#1a49b0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
    .t-io{fill:#5c6773;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.08em}
    .t-badge{fill:#2f6df0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;font-weight:600}
    .t-note{fill:#5c6773;font-size:12.5px;font-style:italic}
    .t-div{fill:#5c6773;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.1em}
    .flow-line{stroke:#2f6df0;stroke-width:2;fill:none}
    .train-line{stroke:#8896a6;stroke-width:1.75;fill:none;stroke-dasharray:5 4}
    .divider{stroke:#c4cdd8;stroke-width:1.5;stroke-dasharray:2 5}
    .head{fill:#18212c;font-size:21px;font-weight:700}
    .headsub{fill:#5c6773;font-size:13px}
    .leg{fill:#3a4653;font-size:12.5px}
  </style>
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#2f6df0"/></marker>
    <marker id="ah-t" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8 Z" fill="#8896a6"/></marker>
  </defs>

  <rect class="bg" x="6" y="-116" width="988" height="1354" rx="18"/>
  <text class="head" x="34" y="-80">DistillStudent — network architecture</text>
  <text class="headsub" x="34" y="-58">forward-only Rummikub DAgger student · 116,919 params (≈93,570 active at inference)</text>
  <!-- legend -->
  <rect class="box-flow" x="34" y="-44" width="15" height="15" rx="4"/>
  <text class="leg" x="56" y="-32">inference path</text>
  <rect class="box-train" x="184" y="-44" width="15" height="15" rx="4"/>
  <text class="leg" x="206" y="-32">training-only head</text>
  <rect class="box-action" x="356" y="-44" width="15" height="15" rx="4"/>
  <text class="leg" x="378" y="-32">chosen action</text>

  <!-- ============ INPUTS ============ -->
  <text x="250" y="34" text-anchor="middle" class="t-io">INPUT · STATE</text>
  <text x="750" y="34" text-anchor="middle" class="t-io">INPUT · CANDIDATES</text>

  <rect class="box" x="130" y="44" width="240" height="52" rx="10"/>
  <text x="250" y="66" text-anchor="middle" class="t-title">state</text>
  <text x="250" y="85" text-anchor="middle" class="t-sub">vector · 108</text>

  <rect class="box" x="630" y="44" width="240" height="52" rx="10"/>
  <text x="750" y="66" text-anchor="middle" class="t-title">cand_feats</text>
  <text x="750" y="85" text-anchor="middle" class="t-sub">20 x 104</text>

  <path class="flow-line" d="M250,96 L250,148" marker-end="url(#ah)"/>
  <path class="flow-line" d="M750,96 L750,148" marker-end="url(#ah)"/>

  <!-- ============ ENCODERS ============ -->
  <rect class="box-flow" x="130" y="150" width="240" height="70" rx="10"/>
  <text x="250" y="180" text-anchor="middle" class="t-title">state_encoder</text>
  <text x="250" y="200" text-anchor="middle" class="t-sub-flow">Linear 108-128 . ReLU x2</text>

  <rect class="ghost" x="646" y="150" width="240" height="70" rx="10"/>
  <rect class="ghost" x="638" y="158" width="240" height="70" rx="10"/>
  <rect class="box-flow" x="630" y="166" width="240" height="70" rx="10"/>
  <text x="750" y="196" text-anchor="middle" class="t-title">cand_encoder</text>
  <text x="750" y="216" text-anchor="middle" class="t-sub-flow">Linear 104-128 . ReLU x2</text>
  <text x="905" y="160" text-anchor="middle" class="t-badge">x20</text>
  <text x="905" y="176" text-anchor="middle" class="t-badge">shared</text>

  <path class="flow-line" d="M250,220 L250,270" marker-end="url(#ah)"/>
  <path class="flow-line" d="M750,236 L750,270" marker-end="url(#ah)"/>

  <!-- ============ EMBEDS ============ -->
  <rect class="box" x="130" y="272" width="240" height="50" rx="10"/>
  <text x="250" y="293" text-anchor="middle" class="t-title">state_embed</text>
  <text x="250" y="311" text-anchor="middle" class="t-sub">128</text>

  <rect class="box" x="630" y="272" width="240" height="50" rx="10"/>
  <text x="750" y="293" text-anchor="middle" class="t-title">cand_embed</text>
  <text x="750" y="311" text-anchor="middle" class="t-sub">20 x 128</text>

  <text x="750" y="343" text-anchor="middle" class="t-note">scored independently -&gt; order-invariant</text>

  <path class="flow-line" d="M310,322 C360,360 400,372 452,398" marker-end="url(#ah)"/>
  <path class="flow-line" d="M690,322 C640,360 600,372 548,398" marker-end="url(#ah)"/>
  <path class="flow-line" d="M210,322 C190,380 200,440 244,498" marker-end="url(#ah)"/>

  <!-- ============ CONCAT / MERGE ============ -->
  <rect class="box-flow" x="350" y="400" width="300" height="64" rx="10"/>
  <text x="500" y="428" text-anchor="middle" class="t-title">broadcast state + concat</text>
  <text x="500" y="448" text-anchor="middle" class="t-sub-flow">per candidate -&gt; 20 x 256</text>

  <path class="flow-line" d="M500,464 L500,502" marker-end="url(#ah)"/>

  <!-- ============ SCORE HEAD + DRAW HEAD ============ -->
  <rect class="box-flow" x="350" y="504" width="300" height="60" rx="10"/>
  <text x="500" y="530" text-anchor="middle" class="t-title">score_head</text>
  <text x="500" y="549" text-anchor="middle" class="t-sub-flow">Linear 256-128-1</text>

  <rect class="box-flow" x="130" y="504" width="240" height="60" rx="10"/>
  <text x="250" y="530" text-anchor="middle" class="t-title">draw_head</text>
  <text x="250" y="549" text-anchor="middle" class="t-sub-flow">Linear 128-1 . bias -1.97</text>

  <path class="flow-line" d="M500,564 L500,600" marker-end="url(#ah)"/>
  <path class="flow-line" d="M250,564 L250,600" marker-end="url(#ah)"/>

  <rect class="box" x="350" y="602" width="300" height="50" rx="10"/>
  <text x="500" y="632" text-anchor="middle" class="t-title">20 candidate scores</text>

  <rect class="box" x="130" y="602" width="240" height="50" rx="10"/>
  <text x="250" y="632" text-anchor="middle" class="t-title">1 draw score</text>

  <path class="flow-line" d="M500,652 L500,688" marker-end="url(#ah)"/>
  <path class="flow-line" d="M250,652 L250,672 L440,672 L440,688" marker-end="url(#ah)"/>

  <!-- ============ LOGITS -> MASK -> ACTION ============ -->
  <rect class="box-flow" x="350" y="690" width="300" height="52" rx="10"/>
  <text x="500" y="721" text-anchor="middle" class="t-title">concat -&gt; logits · 21</text>
  <path class="flow-line" d="M500,742 L500,776" marker-end="url(#ah)"/>

  <rect class="box" x="350" y="778" width="300" height="50" rx="10"/>
  <text x="500" y="808" text-anchor="middle" class="t-title">mask illegal moves</text>
  <path class="flow-line" d="M500,828 L500,862" marker-end="url(#ah)"/>

  <rect class="box-action" x="350" y="864" width="300" height="60" rx="10"/>
  <text x="500" y="890" text-anchor="middle" class="t-title">argmax -&gt; action</text>
  <text x="500" y="909" text-anchor="middle" class="t-sub" fill="#d6811f">the move it plays</text>

  <!-- ============ TRAINING-ONLY ============ -->
  <line class="divider" x1="70" y1="972" x2="930" y2="972"/>
  <text x="70" y="1000" class="t-div">TRAINING-ONLY · INACTIVE AT INFERENCE</text>

  <path class="train-line" d="M130,297 L74,297 L74,1052 L296,1052" marker-end="url(#ah-t)"/>

  <rect class="box-train" x="300" y="1022" width="300" height="64" rx="10"/>
  <text x="450" y="1050" text-anchor="middle" class="t-title">opp_hand_head</text>
  <text x="450" y="1069" text-anchor="middle" class="t-sub">128-128-52 . opponent hand</text>

  <rect class="box-train" x="650" y="1022" width="230" height="64" rx="10"/>
  <text x="765" y="1050" text-anchor="middle" class="t-title">critic</text>
  <text x="765" y="1069" text-anchor="middle" class="t-sub">128-1 . state value (RL)</text>

  <path class="train-line" d="M600,1054 L650,1054" marker-end="url(#ah-t)"/>
  <text x="490" y="1112" text-anchor="middle" class="t-note">both read the 128-d state embedding; shape the representation during distillation only</text>
</svg>
